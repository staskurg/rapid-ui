# Detail-only resource — GET /{id} only, no list, create, update, delete
openapi: 3.0.3
info:
  title: Detail Only API
  version: 1.0.0
paths:
  /items/{id}:
    get:
      operationId: getItem
      summary: Get item by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  status:
                    type: string
                required: [id, name]
