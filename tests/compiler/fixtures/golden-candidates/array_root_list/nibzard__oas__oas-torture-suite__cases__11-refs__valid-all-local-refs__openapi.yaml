openapi: 3.1.0
info:
  title: All Local $refs
  version: 1.0.0
paths:
  /users:
    get:
      operationId: listUsers
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
    post:
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /users/{userId}:
    get:
      operationId: getUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    # Base user schema
    User:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UserId'
        name:
          type: string
        email:
          type: string
          format: email
      required:
        - id
        - name
        - email
    # User ID type (reusable)
    UserId:
      type: string
      format: uuid
    # User list response
    UserList:
      type: array
      items:
        $ref: '#/components/schemas/User'
    # User creation request (no id required)
    UserCreate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
      required:
        - name
        - email
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      description: User ID
      schema:
        $ref: '#/components/schemas/UserId'
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
