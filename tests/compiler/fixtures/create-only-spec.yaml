# Create-only resource — POST only, no list, detail, update, delete
openapi: 3.0.3
info:
  title: Create Only API
  version: 1.0.0
paths:
  /items:
    post:
      operationId: createItem
      summary: Create item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                status:
                  type: string
                  enum: [draft, active]
              required: [name]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  status:
                    type: string
                required: [id, name]
