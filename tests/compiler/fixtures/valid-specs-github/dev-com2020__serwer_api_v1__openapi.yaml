openapi: 3.0.3
info:
  title: API Kursantów z Autoryzacją JWT
  description: |
    API do zarządzania kursantami z systemem autoryzacji JWT. 
    Aplikacja Flask z bazą danych SQLite umożliwiająca rejestrację użytkowników, 
    logowanie oraz operacje CRUD na kursantach z odpowiednimi uprawnieniami.
    
    ## Autoryzacja
    API używa JWT (JSON Web Tokens) do autoryzacji. Po zalogowaniu otrzymujesz token,
    który należy przekazywać w nagłówku `Authorization: Bearer <token>`.
    
    ## Role użytkowników
    - **user** - może przeglądać i modyfikować kursantów
    - **admin** - dodatkowo może zarządzać użytkownikami
    
    ## Przykładowe konta
    - Admin: `admin` / `admin123`
    - User: `user` / `user123`
  version: "2.0"
  contact:
    name: API Support
    url: http://localhost:5000
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:5000
    description: Serwer deweloperski
  - url: http://0.0.0.0:5000
    description: Serwer produkcyjny lokalny

tags:
  - name: Public
    description: Publiczne endpointy (bez autoryzacji)
  - name: Authentication
    description: Endpointy związane z autoryzacją
  - name: Kursanci
    description: Zarządzanie kursantami (wymaga autoryzacji)
  - name: Admin
    description: Funkcje administracyjne (wymaga roli admin)

paths:
  /:
    get:
      tags:
        - Public
      summary: Informacje o API
      description: Zwraca podstawowe informacje o API i dostępnych endpointach
      responses:
        '200':
          description: Informacje o API
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Witaj w API Kursantów z Autoryzacją JWT!"
                  version:
                    type: string
                    example: "2.0"
                  database:
                    type: string
                    example: "SQLite"
                  authorization:
                    type: string
                    example: "JWT (JSON Web Tokens)"
                  endpoints:
                    type: object
                    description: Lista dostępnych endpointów

  /health:
    get:
      tags:
        - Public
      summary: Status połączenia z bazą danych
      description: Sprawdza czy połączenie z bazą danych SQLite działa poprawnie
      responses:
        '200':
          description: Połączenie działa prawidłowo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "OK"
                  database:
                    type: string
                    example: "Connected (SQLite)"
                  database_path:
                    type: string
                    example: "kursanci_auth.db"
                  message:
                    type: string
                    example: "Połączenie z bazą danych działa poprawnie"
        '500':
          description: Błąd połączenia z bazą danych
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/register:
    post:
      tags:
        - Authentication
      summary: Rejestracja nowego użytkownika
      description: Tworzy nowe konto użytkownika z rolą 'user'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
                - email
              properties:
                username:
                  type: string
                  minLength: 3
                  example: "jan_kowalski"
                password:
                  type: string
                  minLength: 6
                  example: "bezpieczne_haslo123"
                email:
                  type: string
                  format: email
                  example: "jan.kowalski@example.com"
      responses:
        '201':
          description: Użytkownik został zarejestrowany pomyślnie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Nieprawidłowe dane lub użytkownik już istnieje
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Błąd serwera podczas rejestracji
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Logowanie użytkownika
      description: Loguje użytkownika i zwraca token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: "admin"
                password:
                  type: string
                  example: "admin123"
      responses:
        '200':
          description: Logowanie pomyślne
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Zalogowano pomyślnie"
                  token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  user:
                    $ref: '#/components/schemas/UserInfo'
        '400':
          description: Brak wymaganych danych
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Nieprawidłowe dane logowania
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/me:
    get:
      tags:
        - Authentication
      summary: Informacje o zalogowanym użytkowniku
      description: Zwraca informacje o aktualnie zalogowanym użytkowniku
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Informacje o użytkowniku
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  user:
                    $ref: '#/components/schemas/CurrentUserInfo'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /kursanci:
    get:
      tags:
        - Kursanci
      summary: Lista wszystkich kursantów
      description: Pobiera listę wszystkich kursantów posortowaną alfabetycznie
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista kursantów
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  count:
                    type: integer
                    example: 15
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Kursant'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags:
        - Kursanci
      summary: Dodaj nowego kursanta
      description: Tworzy nowego kursanta w systemie
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KursantInput'
      responses:
        '201':
          description: Kursant został dodany pomyślnie
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Kursant został dodany pomyślnie"
                  added_by:
                    type: string
                    example: "admin"
        '400':
          description: Nieprawidłowe dane wejściowe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/ServerError'

  /kursanci/{id}:
    get:
      tags:
        - Kursanci
      summary: Pobierz kursanta po ID
      description: Zwraca dane konkretnego kursanta
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID kursanta
          example: 1
      responses:
        '200':
          description: Dane kursanta
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Kursant'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Nie znaleziono kursanta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Kursanci
      summary: Zaktualizuj dane kursanta
      description: Modyfikuje dane istniejącego kursanta
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID kursanta
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KursantInput'
      responses:
        '200':
          description: Kursant został zaktualizowany
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Dane kursanta zostały zaktualizowane"
                  updated_by:
                    type: string
                    example: "admin"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Nie znaleziono kursanta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/ServerError'

    delete:
      tags:
        - Kursanci
      summary: Usuń kursanta
      description: Usuwa kursanta z systemu
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID kursanta
          example: 1
      responses:
        '200':
          description: Kursant został usunięty
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Kursant został usunięty"
                  deleted_by:
                    type: string
                    example: "admin"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Nie znaleziono kursanta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/ServerError'

  /kursanci/random:
    get:
      tags:
        - Kursanci
      summary: Losuj jednego kursanta
      description: Zwraca losowo wybranego kursanta z bazy danych
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Wylosowany kursant
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Wylosowano kursanta"
                  data:
                    $ref: '#/components/schemas/Kursant'
                  drawn_by:
                    type: string
                    example: "admin"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Brak kursantów w bazie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /kursanci/random/{count}:
    get:
      tags:
        - Kursanci
      summary: Losuj N kursantów
      description: Zwraca określoną liczbę losowo wybranych kursantów (maksymalnie 50)
      security:
        - bearerAuth: []
      parameters:
        - name: count
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 50
          description: Liczba kursantów do wylosowania
          example: 3
      responses:
        '200':
          description: Wylosowani kursanci
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Wylosowano 3 kursantów"
                  requested:
                    type: integer
                    example: 3
                  drawn:
                    type: integer
                    example: 3
                  total_available:
                    type: integer
                    example: 15
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Kursant'
                  drawn_by:
                    type: string
                    example: "admin"
        '400':
          description: Nieprawidłowa liczba kursantów
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Brak kursantów w bazie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/users:
    get:
      tags:
        - Admin
      summary: Lista wszystkich użytkowników
      description: Pobiera listę wszystkich użytkowników (tylko dla administratorów)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista użytkowników
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  count:
                    type: integer
                    example: 5
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/ServerError'

  /admin/users/{id}:
    delete:
      tags:
        - Admin
      summary: Usuń użytkownika
      description: Usuwa użytkownika z systemu (tylko dla administratorów)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID użytkownika
          example: 2
      responses:
        '200':
          description: Użytkownik został usunięty
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Użytkownik został usunięty"
        '400':
          description: Nie można usunąć własnego konta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Nie znaleziono użytkownika
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token otrzymany po zalogowaniu.
        Format: `Bearer <token>`
        Przykład: `Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...`

  schemas:
    Kursant:
      type: object
      properties:
        KursantID:
          type: integer
          example: 1
        Imie:
          type: string
          example: "Jan"
        Nazwisko:
          type: string
          example: "Kowalski"
        Email:
          type: string
          format: email
          example: "jan.kowalski@example.com"
        DataUrodzenia:
          type: string
          format: date
          nullable: true
          example: "1990-05-15"
        Miasto:
          type: string
          nullable: true
          example: "Warszawa"
        DodanePrzez:
          type: integer
          nullable: true
          example: 1
          description: "ID użytkownika, który dodał kursanta"

    KursantInput:
      type: object
      required:
        - Imie
        - Nazwisko
        - Email
      properties:
        Imie:
          type: string
          minLength: 1
          example: "Jan"
        Nazwisko:
          type: string
          minLength: 1
          example: "Kowalski"
        Email:
          type: string
          format: email
          example: "jan.kowalski@example.com"
        DataUrodzenia:
          type: string
          format: date
          nullable: true
          example: "1990-05-15"
        Miasto:
          type: string
          nullable: true
          example: "Warszawa"

    User:
      type: object
      properties:
        UzytkownikID:
          type: integer
          example: 1
        Username:
          type: string
          example: "admin"
        Email:
          type: string
          format: email
          example: "admin@example.com"
        Rola:
          type: string
          enum: [admin, user]
          example: "admin"
        DataRejestracji:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"

    UserInfo:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: "admin"
        email:
          type: string
          format: email
          example: "admin@example.com"
        role:
          type: string
          enum: [admin, user]
          example: "admin"

    CurrentUserInfo:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: "admin"
        role:
          type: string
          enum: [admin, user]
          example: "admin"

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Operacja zakończona pomyślnie"

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Opis błędu"

  responses:
    UnauthorizedError:
      description: Brak autoryzacji - wymagany prawidłowy token JWT
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: "Brak tokenu autoryzacyjnego. Zaloguj się najpierw."

    ForbiddenError:
      description: Brak uprawnień - wymagana rola administratora
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: "Brak uprawnień. Wymagana rola: admin"

    ServerError:
      description: Błąd serwera
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: "Wewnętrzny błąd serwera"

security:
  - bearerAuth: []