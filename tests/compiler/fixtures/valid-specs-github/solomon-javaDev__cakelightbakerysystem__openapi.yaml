openapi: 3.1.0
info:
  title: Sales Management API
  description: |
    A comprehensive API for managing sales, orders, and products across multiple outlets.
    This API provides functionality for creating sales transactions, managing guest orders,
    and retrieving product and sales information.
  version: 1.0.0
  contact:
    name: API Support
  license:
    name: Proprietary

servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://api.example.com
    description: Production server

tags:
  - name: Sales
    description: Sales transaction management and analytics
  - name: Orders
    description: Guest order creation and management
  - name: Products
    description: Product catalog and availability

paths:
  /sales:
    post:
      tags:
        - Sales
      summary: Create a new sale transaction
      description: Records a new sale with multiple items for a specific outlet
      operationId: createSale
      parameters:
        - name: outletId
          in: query
          description: The unique identifier of the outlet where the sale occurs
          required: true
          schema:
            type: integer
            format: int64
            example: 1
      requestBody:
        description: Sale details with items to be recorded
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSaleRequest'
      responses:
        '200':
          description: Sale successfully created
          content:
            application/json:
              schema:
                type: object
                properties:
                  saleId:
                    type: integer
                    format: int64
                    example: 12345
                  timestamp:
                    type: string
                    format: date-time
                  totalAmount:
                    type: number
                    format: double
        '400':
          description: Invalid request parameters
        '500':
          description: Internal server error

  /sales/today:
    get:
      tags:
        - Sales
      summary: Retrieve today's sales
      description: Gets all sales transactions for today, optionally filtered by outlet
      operationId: getTodaysSales
      parameters:
        - name: outletId
          in: query
          description: Optional outlet filter - if omitted, returns sales from all outlets
          required: false
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: List of today's sales
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    saleId:
                      type: integer
                      format: int64
                    outletId:
                      type: integer
                      format: int64
                    totalAmount:
                      type: number
                      format: double
                    timestamp:
                      type: string
                      format: date-time
        '500':
          description: Internal server error

  /sales/recent:
    get:
      tags:
        - Sales
      summary: Get recent sales
      description: Retrieves the most recent sales transactions across all outlets
      operationId: getRecentSales
      responses:
        '200':
          description: List of recent sales
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    saleId:
                      type: integer
                      format: int64
                    outletId:
                      type: integer
                      format: int64
                    totalAmount:
                      type: number
                      format: double
                    timestamp:
                      type: string
                      format: date-time
        '500':
          description: Internal server error

  /sales/products:
    get:
      tags:
        - Products
      summary: Get products by outlet
      description: Retrieves all products available at a specific outlet with optional search filter
      operationId: getProductsByOutlet
      parameters:
        - name: outletId
          in: query
          description: The outlet ID to filter products
          required: false
          schema:
            type: integer
            format: int64
            example: 1
        - name: search
          in: query
          description: Optional search term to filter products by name
          required: false
          schema:
            type: string
            example: "coffee"
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '500':
          description: Internal server error

  /public/api/products:
    get:
      tags:
        - Products
      summary: Get products (public endpoint)
      description: Public API to retrieve products with optional filtering by outlet and search term
      operationId: getProductsApi
      parameters:
        - name: outletId
          in: query
          description: Optional outlet ID filter
          required: false
          schema:
            type: integer
            format: int64
            example: 1
        - name: search
          in: query
          description: Optional search term for product names
          required: false
          schema:
            type: string
            example: "coffee"
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  count:
                    type: integer
                    example: 10
        '500':
          description: Internal server error

  /public/orders/guest:
    post:
      tags:
        - Orders
      summary: Create a guest order
      description: Creates a new order for guest customers without requiring registration
      operationId: createGuestOrder
      requestBody:
        description: Guest order details
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGuestOrderRequest'
      responses:
        '200':
          description: Guest order successfully created
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderId:
                    type: integer
                    format: int64
                    example: 98765
                  customerName:
                    type: string
                  deliveryDate:
                    type: string
                    format: date
                  totalPrice:
                    type: number
                    format: double
        '400':
          description: Invalid request data
        '500':
          description: Internal server error

components:
  schemas:
    CreateSaleRequest:
      type: object
      description: Request payload for creating a sale transaction
      required:
        - items
      properties:
        items:
          type: array
          description: List of items included in this sale
          minItems: 1
          items:
            $ref: '#/components/schemas/SaleItem'
      example:
        items:
          - productId: 1
            quantity: 2
            unitPrice: 29.99
          - productId: 3
            quantity: 1
            unitPrice: 15.50

    SaleItem:
      type: object
      description: Individual item in a sale transaction
      required:
        - productId
        - quantity
        - unitPrice
      properties:
        productId:
          type: integer
          format: int64
          description: Unique identifier of the product being sold
          example: 1
        quantity:
          type: integer
          format: int32
          description: Number of units sold
          example: 2
          minimum: 1
        unitPrice:
          type: number
          format: double
          description: Price per unit at the time of sale
          example: 29.99
          minimum: 0

    CreateGuestOrderRequest:
      type: object
      description: Request payload for creating a guest customer order
      required:
        - customerName
        - customerPhone
        - outletId
        - deliveryDate
        - totalPrice
      properties:
        customerName:
          type: string
          description: Full name of the guest customer
          example: "John Doe"
          minLength: 1
          maxLength: 255
        customerPhone:
          type: string
          description: Contact phone number for the customer
          example: "+1-555-0123"
          pattern: '^\+?[1-9]\d{1,14}$'
        customerEmail:
          type: string
          description: Customer email address (optional)
          format: email
          example: "john@example.com"
        outletId:
          type: integer
          format: int64
          description: The outlet ID where the order will be fulfilled
          example: 1
        deliveryDate:
          type: string
          format: date
          description: Requested delivery date for the order
          example: "2025-12-15"
        orderDetails:
          type: string
          description: Additional details or special instructions for the order
          example: "Extra napkins please"
          maxLength: 1000
        units:
          type: integer
          format: int32
          description: Number of units ordered
          example: 5
          minimum: 1
        totalPrice:
          type: number
          format: double
          description: Total price for the order
          example: 149.95
          minimum: 0

    Product:
      type: object
      description: Product information with availability and pricing
      properties:
        id:
          type: integer
          format: int64
          description: Unique product identifier
          example: 1
        name:
          type: string
          description: Product name
          example: "Premium Coffee Beans"
        price:
          type: number
          format: double
          description: Current selling price
          example: 29.99
          minimum: 0
        quantity:
          type: integer
          format: int32
          description: Current stock quantity at this outlet
          example: 50
          minimum: 0
        minimumStockLevel:
          type: integer
          format: int32
          description: Minimum threshold before reordering is triggered
          example: 10
          minimum: 0
        outlet:
          $ref: '#/components/schemas/Outlet'

    Outlet:
      type: object
      description: Outlet or store location information
      properties:
        id:
          type: integer
          format: int64
          description: Unique outlet identifier
          example: 1
        name:
          type: string
          description: Outlet name or store name
          example: "Downtown Branch"
        location:
          type: string
          description: Physical location or address
          example: "123 Main Street, Downtown"
