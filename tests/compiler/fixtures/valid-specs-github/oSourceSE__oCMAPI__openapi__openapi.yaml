openapi: 3.0.0
info:
  title: oCMAPI
  version: 1.0.5
  license:
    name: BSD License
    url: https://www.osource.se/license.html
  description: >-
    Container Management API for podman containers.


    A project sprung out of the urge to learn rust and wanting to build a `API`
    for managing `podman` containers in my local environment.


    All requests and responses are JSON based for all API endpoints.
servers:
  - url: ''
paths:
  /v1/common/getStats:
    get:
      summary: /v1/common/getStats
      tags:
        - Common
      operationId: getLiveStatistics
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    cpu_time:
                      type: string
                    cpu_percent:
                      type: string
                    avg_cpu:
                      type: string
                    mem_usage:
                      type: string
                    mem_percent:
                      type: string
                    net_io:
                      type: string
                    block_io:
                      type: string
                    pids:
                      type: string
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                  Message:
                    type: string
                  Error:
                    type: string
      security:
        - BasicAuth: []
      description: >-
        Get current statistics for CPU, Memory and so on for all running
        containers.
