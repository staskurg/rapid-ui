openapi: 3.1.0
info:
  title: Task Manager API
  version: 1.0.0
  description: API for AI-first task management with relevance-based recommendations

servers:
  - url: https://mindojo.vercel.app

paths:
  /:
    get:
      operationId: queryTasks
      summary: Query tasks (list all, get one, or get best task)
      description: |
        Use action parameter to specify operation:
        - listTasks: Get all tasks, optionally filtered by status
        - getTask: Get a single task by ID
        - getBestTask: Get the highest-priority task for current time context
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [listTasks, getTask, getBestTask]
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, in_progress, completed, all]
          description: Filter by status (for listTasks)
        - name: id
          in: query
          required: false
          schema:
            type: string
          description: Task ID (for getTask)
        - name: hour
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 23
          description: Current hour 0-23 (for getBestTask)
        - name: dayOfWeek
          in: query
          required: false
          schema:
            type: string
            enum: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]
          description: Current day (for getBestTask)
        - name: availableMinutes
          in: query
          required: false
          schema:
            type: integer
          description: Available time filter (for getBestTask)
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

    post:
      operationId: mutateTasks
      summary: Create, update, complete, or snooze tasks
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [createTask, updateTask, completeTask, snoozeTask]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MutationRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

components:
  schemas:
    Task:
      type: object
      properties:
        id:
          type: string
          example: "task_1704067200000_x7k2m"
        title:
          type: string
          example: "Review PR #142"
        description:
          type: string
          nullable: true
        priority:
          type: integer
          minimum: 1
          maximum: 5
          example: 4
        status:
          type: string
          enum: [pending, in_progress, completed]
        dueDate:
          type: string
          format: date
          nullable: true
          example: "2024-01-15"
        snoozedUntil:
          type: string
          format: date-time
          nullable: true
        activeAfter:
          type: string
          format: date-time
          nullable: true
        preferredTime:
          type: string
          enum: [morning, afternoon, evening, any]
          nullable: true
        estimatedMinutes:
          type: integer
          nullable: true
          example: 30
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MutationRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 1000
        priority:
          type: integer
          minimum: 1
          maximum: 5
        id:
          type: string
        status:
          type: string
          enum: [pending, in_progress, completed]
        dueDate:
          type: string
          format: date
        preferredTime:
          type: string
          enum: [morning, afternoon, evening, any]
        estimatedMinutes:
          type: integer
          minimum: 5
          maximum: 480
        until:
          type: string
          format: date-time

    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            task:
              $ref: '#/components/schemas/Task'
            tasks:
              type: array
              items:
                $ref: '#/components/schemas/Task'
            count:
              type: integer
            score:
              type: integer
            explanation:
              type: string
            message:
              type: string
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
