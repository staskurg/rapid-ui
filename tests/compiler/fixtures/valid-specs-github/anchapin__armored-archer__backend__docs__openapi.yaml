  /rpc/armored_archer/get_player_reports:
    post:
      tags:
        - Player RPC
      summary: Get player reports
      description: |
        Get reports filed by or against the current player. Returns a list of
        player reports for moderation and dispute resolution purposes.
      operationId: getPlayerReports
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example: {}
