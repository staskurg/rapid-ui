openapi: 3.0.3
info:
  title: Armored Archer API
  description: |
    API documentation for the Armored Archer game backend powered by Nakama.

    ## Authentication
    The Armored Archer API uses Nakama's authentication system. All RPC endpoints
    require a valid Nakama session token.

    ### Authentication Methods
    1. **Device Authentication** (`/v2/account/authenticate/device`)
       - Authenticate using a unique device identifier
       - Best for mobile platforms (iOS/Android)
       - No user input required

    2. **Email Authentication** (`/v2/account/authenticate/email`)
       - Authenticate using email and password
       - Requires account creation

    ### Including the Token
    All RPC endpoints require the token to be included in the `Authorization` header:
    ```
    Authorization: Bearer <your_session_token>
    ```

    ### Token Lifecycle
    - Tokens expire after 30 days by default
    - Use refresh tokens to extend sessions
    - Store tokens securely on the client

    ## Authorization
    Most endpoints require authentication. The following endpoints are public:
    - `/v2/account/authenticate/*` (all authentication endpoints)

    ## Rate Limits
    - Authentication endpoints: 10 requests/minute
    - Gameplay RPCs: 60 requests/minute
    - Store/Commerce: 30 requests/minute

    ## Error Responses
    All endpoints may return error responses in the following format:
    ```json
    {
      "error": "Error message",
      "error_code": "ERROR_CODE",
      "rpc_name": "rpc_name"
    }
    ```

    ## Common Error Codes
    | Code | Description |
    |------|-------------|
    | ERR_AUTHENTICATION_FAILED | Invalid credentials or expired token |
    | ERR_AUTHORIZATION_FAILED | User lacks permission |
    | ERR_RATE_LIMITED | Too many requests |
    | ERR_VALIDATION_FAILED | Invalid request parameters |
    | ERR_INTERNAL_ERROR | Server-side error |
  version: 1.0.0
  contact:
    name: Armored Archer Support
  license:
    name: MIT
servers:
  - url: https://api.armoredarcher.com
    description: Production server
  - url: https://staging-api.armoredarcher.com
    description: Staging server
  - url: http://localhost:7350
    description: Local development server
tags:
  - name: Authentication
    description: Nakama authentication endpoints
  - name: Player RPG System
    description: Player stats, XP, and stat allocation
  - name: Matchmaking
    description: PvP match creation and management
  - name: Combat System
    description: Combat actions and match state
  - name: Season System
    description: Seasons, leaderboards, and rewards
  - name: Store
    description: In-game purchases and currency
  - name: Gear System
    description: Gear generation and inventory management
  - name: Analytics
    description: Event tracking and analytics
  - name: Player RPC
    description: Player reporting and health check
paths:
  /v2/account/authenticate/device:
    post:
      tags:
        - Authentication
      summary: Authenticate with device ID
      description: |
        Authenticate a user using a device identifier. Creates a new account
        if one doesn't exist, or returns existing session for returning users.
      operationId: authenticateDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - device_id
              properties:
                device_id:
                  type: string
                  description: Unique device identifier
                  example: device_abc123def456
                username:
                  type: string
                  description: Optional username for new accounts
                  example: ArcherPlayer1
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                user_id: user_1234567890
                username: ArcherPlayer1
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Device ID is required
                error_code: INVALID_REQUEST
  /v2/session/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh session token
      description: |
        Refresh an existing session token to extend its validity.
        Requires a valid refresh token.
      operationId: refreshSession
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: Refresh token
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid or expired refresh token
  /rpc/armored_archer/gain_xp:
    post:
      tags:
        - Player RPG System
      summary: Gain experience points
      description: |
        Add XP to the player's stats. If the player doesn't have stats yet,
        they will be initialized with default values.

        Leveling formula: Each level requires progressively more XP.
        Level up grants ability points that can be allocated to stats.
      operationId: gainXP
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GainXPRequest'
            example:
              xp_amount: 150
              source: pve
      responses:
        '200':
          description: XP gained successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GainXPResponse'
              example:
                success: true
                player_stats:
                  user_id: user_1234567890
                  level: 2
                  xp: 50
                  ability_points: 1
                  stats:
                    attack: 10
                    defense: 10
                    dodge: 10
                    crit_rate: 5
                xp_gained: 150
                levels_gained: 1
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /rpc/armored_archer/allocate_stats:
    post:
      tags:
        - Player RPG System
      summary: Allocate ability points to stats
      description: |
        Allocate ability points to increase player stats. Available stats are:
        - attack: Increases damage dealt
        - defense: Reduces damage taken
        - dodge: Chance to avoid attacks
        - crit_rate: Chance to deal critical damage

        Requires player to have sufficient ability points.
      operationId: allocateStats
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllocateStatsRequest'
            example:
              stat_name: attack
              points: 1
      responses:
        '200':
          description: Stats allocated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllocateStatsResponse'
              example:
                success: true
                player_stats:
                  user_id: user_1234567890
                  level: 2
                  xp: 50
                  ability_points: 0
                  stats:
                    attack: 11
                    defense: 10
                    dodge: 10
                    crit_rate: 5
        '400':
          description: Not enough ability points or invalid stat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Not enough ability points
        '404':
          description: Player stats not found
  /rpc/armored_archer/get_player_stats:
    post:
      tags:
        - Player RPG System
      summary: Get player stats
      description: |
        Retrieve the current player's stats including level, XP, ability points,
        and combat statistics. Results are cached for performance.
      operationId: getPlayerStats
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetPlayerStatsRequest'
            example: {}
      responses:
        '200':
          description: Player stats retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerStats'
              example:
                user_id: user_1234567890
                level: 5
                xp: 450
                ability_points: 3
                stats:
                  attack: 15
                  defense: 12
                  dodge: 11
                  crit_rate: 8
        '404':
          description: Player stats not found
  /rpc/armored_archer/list_matches:
    post:
      tags:
        - Matchmaking
      summary: List available matches
      description: |
        List available PvP matches that the player can join.
        Supports filtering by match type and rank range.
      operationId: listMatches
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListMatchesRequest'
            example:
              match_type: ranked
              min_rank: 100
              max_rank: 500
              limit: 20
      responses:
        '200':
          description: Matches listed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListMatchesResponse'
              example:
                success: true
                matches:
                  - match_id: match_1234567890
                    creator_id: user_abcdef
                    creator_rank: 150
                    match_type: ranked
                    is_punch_up: false
                    status: pending
                    created_at: 1699999999000
                player_rank: 200
                total: 1
  /rpc/armored_archer/create_match:
    post:
      tags:
        - Matchmaking
      summary: Create a new PvP match
      description: |
        Create a new PvP match. Can be:
        - Open match: Any player can accept
        - Direct challenge: Specific opponent invited

        Ranked matches affect leaderboard standings.
      operationId: createMatch
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMatchRequest'
            example:
              match_type: ranked
              is_punch_up: false
      responses:
        '200':
          description: Match created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMatchResponse'
              example:
                success: true
                match:
                  match_id: match_1234567890
                  creator_id: user_1234567890
                  opponent_id: ''
                  creator_rank: 200
                  opponent_rank: 0
                  match_type: ranked
                  is_punch_up: false
                  status: pending
                  created_at: 1700000000000
        '400':
          description: Invalid request or rank difference too large
  /rpc/armored_archer/accept_match:
    post:
      tags:
        - Matchmaking
      summary: Accept a pending match
      description: |
        Accept a pending match invitation. Both players must be present
        for the match to become active.
      operationId: acceptMatch
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptMatchRequest'
            example:
              match_id: match_1234567890
      responses:
        '200':
          description: Match accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptMatchResponse'
              example:
                success: true
                match:
                  match_id: match_1234567890
                  creator_id: user_abcdef
                  opponent_id: user_1234567890
                  creator_rank: 150
                  opponent_rank: 200
                  match_type: ranked
                  status: active
        '400':
          description: Match not available or already accepted
  /rpc/armored_archer/get_player_rank:
    post:
      tags:
        - Matchmaking
      summary: Get player rank
      description: |
        Get the current player's rank based on their stats.
        Rank is calculated as: (level * 10) + (total_stats / 4)
      operationId: getPlayerRank
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetPlayerRankRequest'
            example: {}
      responses:
        '200':
          description: Rank retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPlayerRankResponse'
              example:
                success: true
                rank: 200
                level: 5
                xp: 450
  /rpc/armored_archer/submit_combat_action:
    post:
      tags:
        - Combat System
      summary: Submit a combat action
      description: |
        Submit an action during an active PvP match. Currently only "shoot" action
        is supported. The action is processed server-side for fair combat.

        Combat mechanics:
        - Hit chance: 1 - (dodge / 100)
        - Damage: (10 + attack * 0.5) - (defense * 0.3)
        - Critical: 2x damage if crit roll succeeds
      operationId: submitCombatAction
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitCombatActionRequest'
            example:
              match_id: match_1234567890
              action_type: shoot
              angle: 0.78
              power: 85
      responses:
        '200':
          description: Combat action processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitCombatActionResponse'
              example:
                success: true
                result:
                  success: true
                  hit: true
                  damage: 25
                  is_crit: false
                  match_status: active
        '400':
          description: Not your turn or match not active
  /rpc/armored_archer/get_match_state:
    post:
      tags:
        - Combat System
      summary: Get current match state
      description: |
        Get the current state of an active match including health,
        turn number, and combat log.
      operationId: getMatchState
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetMatchStateRequest'
            example:
              match_id: match_1234567890
      responses:
        '200':
          description: Match state retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchState'
              example:
                match_id: match_1234567890
                turn: 3
                current_turn_user_id: user_1234567890
                creator_id: user_abcdef
                opponent_id: user_1234567890
                creator_health: 75
                opponent_health: 100
                status: active
  /rpc/armored_archer/get_season_info:
    post:
      tags:
        - Season System
      summary: Get current season info
      description: |
        Get information about the current active season including
        duration, time remaining, and player's current rank.
      operationId: getSeasonInfo
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetSeasonInfoRequest'
            example: {}
      responses:
        '200':
          description: Season info retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSeasonInfoResponse'
              example:
                success: true
                season:
                  season_id: season_5
                  season_number: 5
                  start_time: 1700000000000
                  end_time: 1702598400000
                  status: active
                  duration_weeks: 4
                player_rank: 45
                player_score: 1250
                time_remaining: 2592000000
  /rpc/armored_archer/get_leaderboard:
    post:
      tags:
        - Season System
      summary: Get season leaderboard
      description: |
        Get the current season leaderboard with top players.
        Returns ranked entries with wins, losses, and win rate.
      operationId: getLeaderboard
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetLeaderboardRequest'
            example:
              limit: 50
      responses:
        '200':
          description: Leaderboard retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetLeaderboardResponse'
              example:
                success: true
                season:
                  season_id: season_5
                  season_number: 5
                leaderboard:
                  - owner_id: user_001
                    username: TopPlayer
                    rank: 1
                    score: 1800
                    meta:
                      wins: 50
                      losses: 5
                      win_rate: 0.91
                      punch_up_wins: 15
  /rpc/armored_archer/update_rank:
    post:
      tags:
        - Season System
      summary: Update player rank after match
      description: |
        Update the leaderboard after a PvP match using Elo rating system.

        - K-factor for normal matches: 32
        - K-factor for punch-up matches: 60

        Punch-up = fighting someone with higher rank.
      operationId: updateRank
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRankRequest'
            example:
              winner_id: user_1234567890
              loser_id: user_abcdef
              winner_old_rank: 1200
              loser_old_rank: 1150
              winner_new_rank: 1220
              loser_new_rank: 1130
              is_punch_up: false
      responses:
        '200':
          description: Rank updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateRankResponse'
              example:
                success: true
                winner:
                  user_id: user_1234567890
                  old_rank: 1200
                  new_rank: 1220
                  rank_change: 20
                loser:
                  user_id: user_abcdef
                  old_rank: 1150
                  new_rank: 1130
                  rank_change: -20
  /rpc/armored_archer/get_season_rewards:
    post:
      tags:
        - Season System
      summary: Get season rewards preview
      description: |
        Preview the rewards the player will receive based on their
        current season rank. Rewards are tiered:
        - Legendary (Rank 1-10): 10000 coins, 500 gems, champion title + aura
        - Epic (Rank 11-50): 5000 coins, 200 gems, elite title
        - Rare (Rank 51-100): 2000 coins, 100 gems, veteran title
        - Uncommon (Rank 101-500): 500 coins
        - Common (Rank 501+): 100 coins
      operationId: getSeasonRewards
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetSeasonRewardsRequest'
            example: {}
      responses:
        '200':
          description: Rewards preview retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSeasonRewardsResponse'
              example:
                success: true
                rank: 25
                rewards:
                  rank_tier: epic
                  coins: 5000
                  gems: 200
                  cosmetics:
                    title: Season 5 Elite
  /rpc/armored_archer/claim_season_rewards:
    post:
      tags:
        - Season System
      summary: Claim season rewards
      description: |
        Claim the player's season rewards. Can only be claimed once per season.
        Rewards include coins, gems, and cosmetic titles/aura.
      operationId: claimSeasonRewards
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimSeasonRewardsRequest'
            example: {}
      responses:
        '200':
          description: Rewards claimed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimSeasonRewardsResponse'
              example:
                success: true
                rewards:
                  rank_tier: epic
                  coins: 5000
                  gems: 200
                claimed: true
        '400':
          description: Rewards already claimed or no leaderboard entry
  /rpc/armored_archer/end_season:
    post:
      tags:
        - Season System
      summary: End current season (admin)
      description: |
        End the current season and start a new one.
        Creates a new leaderboard for the new season.
      operationId: endSeason
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndSeasonRequest'
            example: {}
      responses:
        '200':
          description: Season ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndSeasonResponse'
              example:
                success: true
                old_season:
                  season_id: season_5
                  status: ended
                new_season:
                  season_id: season_6
                  season_number: 6
                  status: active
  /rpc/armored_archer/validate_purchase:
    post:
      tags:
        - Store
      summary: Validate in-app purchase
      description: |
        Validate a purchase receipt and award gems to the player.
        Supported products:
        - com.armoredarcher.gems.small: 100 gems ($0.99)
        - com.armoredarcher.gems.medium: 550 gems ($4.99)
        - com.armoredarcher.gems.large: 1200 gems ($9.99)
      operationId: validatePurchase
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidatePurchaseRequest'
            example:
              product_id: com.armoredarcher.gems.medium
              platform: ios
              transaction_receipt: base64_encoded_receipt...
      responses:
        '200':
          description: Purchase validated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidatePurchaseResponse'
              example:
                success: true
                gems_awarded: 550
                new_balance: 750
                product_id: com.armoredarcher.gems.medium
        '400':
          description: Invalid product ID
  /rpc/armored_archer/get_currency:
    post:
      tags:
        - Store
      summary: Get player currency
      description: |
        Get the player's current gem and gold balance.
        Results are cached for performance.
      operationId: getCurrency
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetCurrencyRequest'
            example: {}
      responses:
        '200':
          description: Currency retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerCurrency'
              example:
                user_id: user_1234567890
                gems: 500
                gold: 2500
  /rpc/armored_archer/spend_gems:
    post:
      tags:
        - Store
      summary: Spend gems
      description: |
        Spend gems from the player's balance.
        Used for premium features, cosmetics, or in-game purchases.
      operationId: spendGems
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpendGemsRequest'
            example:
              amount: 100
      responses:
        '200':
          description: Gems spent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpendGemsResponse'
              example:
                success: true
                new_balance: 400
                amount_spent: 100
        '400':
          description: Insufficient gems
  /rpc/armored_archer/generate_gear:
    post:
      tags:
        - Gear System
      summary: Generate new gear
      description: |
        Generate a new piece of gear based on the stage.
        Gear has randomized stats and can have modifiers.

        Rarity drop rates:
        - Common: 70%
        - Rare: 25%
        - Legendary: 5%
      operationId: generateGear
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateGearRequest'
            example:
              stage_id: stage_01
              boss_defeated: true
      responses:
        '200':
          description: Gear generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateGearResponse'
              example:
                success: true
                gear:
                  id: gear_1234567890
                  name: Steel Blade +1
                  rarity: rare
                  type: weapon
                  stats:
                    - name: attack
                      base_value: 10
                      value: 15
                    - name: crit_rate
                      base_value: 5
                      value: 8
  /rpc/armored_archer/equip_gear:
    post:
      tags:
        - Gear System
      summary: Equip gear
      description: |
        Equip a piece of gear to the specified slot.
        Slots: weapon, armor, accessory
      operationId: equipGear
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquipGearRequest'
            example:
              gear_id: gear_1234567890
              slot: weapon
      responses:
        '200':
          description: Gear equipped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipGearResponse'
              example:
                success: true
                equipped_gear:
                  weapon: gear_1234567890
                  armor: null
                  accessory: null
        '400':
          description: Gear not found or wrong slot
  /rpc/armored_archer/unequip_gear:
    post:
      tags:
        - Gear System
      summary: Unequip gear
      description: |
        Remove equipped gear from a slot.
      operationId: unequipGear
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnequipGearRequest'
            example:
              slot: weapon
      responses:
        '200':
          description: Gear unequipped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnequipGearResponse'
              example:
                success: true
                equipped_gear:
                  weapon: null
  /rpc/armored_archer/get_inventory:
    post:
      tags:
        - Gear System
      summary: Get player inventory
      description: |
        Get all gear in the player's inventory and currently equipped items.
      operationId: getInventory
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetInventoryRequest'
            example: {}
      responses:
        '200':
          description: Inventory retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerInventory'
              example:
                user_id: user_1234567890
                gear:
                  - id: gear_1234567890
                    name: Steel Blade
                    rarity: rare
                    type: weapon
                equipped_gear:
                  weapon: gear_1234567890
                unlocked_modifier_pools: []
  /rpc/armored_archer/unlock_modifier_pool:
    post:
      tags:
        - Gear System
      summary: Unlock modifier pool
      description: |
        Unlock a new modifier pool for gear generation.
        Modifier pools are typically unlocked by defeating bosses.

        Available modifier pools:
        - piercing_arrow: Boss "boss_wind" unlock
        - heavy_impact: Boss "boss_basic" unlock
        - wind_fury: Boss "boss_wind" unlock
      operationId: unlockModifierPool
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnlockModifierPoolRequest'
            example:
              modifier_id: boss_wind
      responses:
        '200':
          description: Modifier pool unlocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnlockModifierPoolResponse'
              example:
                success: true
                unlocked_modifier_pools:
                  - boss_basic
                  - boss_wind
  /rpc/armored_archer/health_check:
    post:
      tags:
        - Player rpc
      summary: 'RPC: armored_archer/health_check'
