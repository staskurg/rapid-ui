          description: Reports retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  reports:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        reporter_id:
                          type: string
                        reported_user_id:
                          type: string
                        reason:
                          type: string
                        status:
                          type: string
                        created_at:
                          type: integer
        '401':
          description: Unauthorized
