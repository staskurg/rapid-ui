  /rpc/armored_archer/process_pending_purchases:
    post:
      tags:
        - Store
      summary: Process pending purchases
      description: |
        Process any pending purchases that were not completed during app launch.
        This is typically called when the app regains focus or after a network
        reconnection. Processes any stored pending purchases from local storage.
      operationId: processPendingPurchases
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example: {}
      responses:
        '200':
          description: Purchases processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessPendingPurchasesResponse'
              example:
                success: true
                processed: 2
                successful: 2
                results:
                  - product_id: gem_pack_100
                    success: true
                  - product_id: gem_pack_500
                    success: true
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /rpc/armored_archer/check_refunds:
    post:
      tags:
        - Store
      summary: Check for refunds
      description: |
        Check for refunds via RevenueCat API. Should be called on app launch
        to detect chargebacks and reverse any previously granted benefits.
      operationId: checkRefunds
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example: {}
      responses:
        '200':
          description: Refund check completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckRefundsResponse'
              example:
                success: true
                refunds_found: 0
        '500':
          description: Server error checking refunds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /rpc/armored_archer/check_subscriptions:
    post:
      tags:
        - Store
      summary: Check subscription status
      description: |
        Check subscription status via RevenueCat API. Verifies active subscriptions
        and updates player benefits accordingly.
      operationId: checkSubscriptions
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example: {}
      responses:
        '200':
          description: Subscription check completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckSubscriptionsResponse'
              example:
                success: true
                active_subscription: true
                subscription_tier: premium
        '500':
          description: Server error checking subscriptions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /rpc/armored_archer/app_launch_check:
    post:
      tags:
        - Store
      summary: App launch check
      description: |
        Comprehensive check performed on app launch. Processes pending purchases,
        checks for refunds, and verifies subscription status. This is the main
        entry point for store-related initialization.
      operationId: appLaunchCheck
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example: {}
      responses:
        '200':
          description: App launch check completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppLaunchCheckResponse'
              example:
                success: true
                pending_purchases:
                  processed: 0
                refunds:
                  found: 0
                subscription:
                  active: true
                  tier: premium
  /rpc/armored_archer/track_event:
    post:
      tags:
        - Analytics
      summary: Track analytics event
      description: |
        Track a custom analytics event. Events are sent to the analytics pipeline
        for processing and storage.
      operationId: trackEvent
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackEventRequest'
            example:
              event_name: level_completed
              properties:
                level: 5
                score: 1500
                time_seconds: 120
      responses:
        '200':
          description: Event tracked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackEventResponse'
              example:
                success: true
        '400':
          description: Invalid event data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /rpc/armored_archer/get_analytics_summary:
    post:
      tags:
        - Analytics
      summary: Get analytics summary
      description: |
        Get an analytics summary for the current player. Returns aggregated
        statistics about player behavior and engagement.
      operationId: getAnalyticsSummary
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                time_range:
                  type: string
                  enum: [day, week, month, all_time]
                  default: week
            example:
              time_range: week
      responses:
        '200':
          description: Analytics summary retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSummaryResponse'
              example:
                success: true
                summary:
                  total_sessions: 25
                  total_playtime_minutes: 450
                  levels_completed: 42
                  enemies_defeated: 1250
  /rpc/armored_archer/track_revenue:
    post:
      tags:
        - Analytics
      summary: Track revenue event
      description: |
        Track a revenue event. Records purchase information for analytics
        and revenue reporting purposes.
      operationId: trackRevenue
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackRevenueRequest'
            example:
              product_id: gem_pack_100
              amount: 0.99
              currency: USD
              transaction_id: transaction_abc123
      responses:
        '200':
          description: Revenue event tracked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackRevenueResponse'
              example:
                success: true
        '400':
          description: Invalid revenue data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Nakama session token
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message
        error_code:
          type: string
          description: Error code identifier
    ValidationErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Validation error details
        error_code:
          type: string
          enum:
            - VALIDATION_ERROR
        rpc_name:
          type: string
          description: Name of the RPC that failed validation
    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: Session token
        user_id:
          type: string
          description: User ID
        username:
          type: string
          description: Username
    PlayerStats:
      type: object
      properties:
        user_id:
          type: string
        level:
          type: integer
        xp:
          type: integer
        ability_points:
          type: integer
        stats:
          type: object
          properties:
            attack:
              type: integer
            defense:
              type: integer
            dodge:
              type: integer
            crit_rate:
              type: integer
    GainXPRequest:
      type: object
      required:
        - xp_amount
        - source
      properties:
        xp_amount:
          type: integer
          maximum: 1000000
        source:
          type: string
          enum:
            - pve
            - pvp
    GainXPResponse:
      type: object
      properties:
        success:
          type: boolean
        player_stats:
          $ref: '#/components/schemas/PlayerStats'
        xp_gained:
          type: integer
        levels_gained:
          type: integer
    AllocateStatsRequest:
      type: object
      required:
        - stat_name
        - points
      properties:
        stat_name:
          type: string
          enum:
            - attack
            - defense
            - dodge
            - crit_rate
        points:
          type: integer
          maximum: 1000
    AllocateStatsResponse:
      type: object
      properties:
        success:
          type: boolean
        player_stats:
          $ref: '#/components/schemas/PlayerStats'
    GetPlayerStatsRequest:
      type: object
      properties: {}
    PvPMatch:
