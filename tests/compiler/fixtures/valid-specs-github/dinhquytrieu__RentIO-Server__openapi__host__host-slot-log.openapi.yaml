openapi: 3.1.0
info:
  title: RentIO Host Slot Log API
  description: Slot log management endpoints for hosts
  version: 1.0.0
tags:
  - name: Host Slot Logs
    description: Storage slot tracking and management for hosts

paths:
  /host/slot-log/space/{spaceId}:
    get:
      summary: Get all slot logs by space ID
      tags:
        - Host Slot Logs
      security:
        - bearerAuth: []
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: string
          description: MongoDB ObjectId of the space
      responses:
        '200':
          description: Successfully retrieved slot logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SlotLog'

  /host/slot-log/update-status:
    post:
      summary: Update slot log status (checkin/checkout)
      tags:
        - Host Slot Logs
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSlotLogStatusDto'
      responses:
        '200':
          description: Successfully updated slot log status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotLog'

  /host/slot-log/status:
    post:
      summary: Get slot logs by contract ID
      tags:
        - Host Slot Logs
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                contractId:
                  type: string
                  format: uuid
              required:
                - contractId
      responses:
        '200':
          description: Successfully retrieved slot logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SlotLog'

  /host/slot-log/space-slot:
    post:
      summary: Get space slot details by contract ID
      tags:
        - Host Slot Logs
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                contractId:
                  type: string
                  format: uuid
              required:
                - contractId
      responses:
        '200':
          description: Successfully retrieved space slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SpaceSlot'

  /host/slot-log/contract/{contractId}:
    get:
      summary: Get slot logs by contract ID
      tags:
        - Host Slot Logs
      security:
        - bearerAuth: []
      parameters:
        - name: contractId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successfully retrieved slot logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SlotLog'

  /host/slot-log/status/{slotLogId}:
    get:
      summary: Get slot log status
      tags:
        - Host Slot Logs
      security:
        - bearerAuth: []
      parameters:
        - name: slotLogId
          in: path
          required: true
          schema:
            type: string
          description: MongoDB ObjectId of the slot log
      responses:
        '200':
          description: Successfully retrieved slot log status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/SlotLogStatus'
                  slotLog:
                    $ref: '#/components/schemas/SlotLog'

components:
  schemas:
    UpdateSlotLogStatusDto:
      type: object
      properties:
        contractId:
          type: string
          format: uuid
      required:
        - contractId

    SlotLogStatus:
      type: string
      enum: ['PENDING', 'CHECKED_IN', 'CHECKED_OUT', 'EXPIRED', 'CANCELLED']
      description: |
        - PENDING: Booking created but not yet checked in
        - CHECKED_IN: Renter has checked in
        - CHECKED_OUT: Renter has checked out
        - EXPIRED: Booking period has passed without check-in
        - CANCELLED: Booking was cancelled

    SlotLog:
      type: object
      properties:
        _id:
          type: string
          description: MongoDB ObjectId
        contractId:
          type: string
          format: uuid
        subSpaceId:
          type: string
          description: MongoDB ObjectId
        slotId:
          type: integer
        renterId:
          type: string
          format: uuid
        hostId:
          type: string
          format: uuid
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        checkinTime:
          type: string
          format: date-time
          nullable: true
        checkoutTime:
          type: string
          format: date-time
          nullable: true
        status:
          $ref: '#/components/schemas/SlotLogStatus'
        notes:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
          nullable: true
        createdDate:
          type: string
          format: date-time
        lastUpdated:
          type: string
          format: date-time
        deletedDate:
          type: string
          format: date-time
          nullable: true

    SpaceSlot:
      type: object
      properties:
        _id:
          type: string
          description: MongoDB ObjectId
        subSpaceId:
          type: string
          description: MongoDB ObjectId
        slotId:
          type: integer
        slotName:
          type: string
        slotType:
          type: string
          enum: ['STANDARD', 'PREMIUM', 'ECONOMY']
        status:
          type: string
          enum: ['AVAILABLE', 'OCCUPIED', 'RESERVED', 'MAINTENANCE']
        dimensions:
          type: object
          properties:
            width:
              type: number
              format: float
            length:
              type: number
              format: float
            height:
              type: number
              format: float
            unit:
              type: string
              enum: ['meters', 'feet']
        features:
          type: array
          items:
            type: string
        maxWeight:
          type: number
          format: float
          nullable: true
        isActive:
          type: boolean
        createdDate:
          type: string
          format: date-time
        lastUpdated:
          type: string
          format: date-time
        deletedDate:
          type: string
          format: date-time
          nullable: true

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT