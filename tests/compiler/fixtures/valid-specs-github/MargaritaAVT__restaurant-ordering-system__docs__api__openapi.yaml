openapi: 3.0.4
info:
  title: Restaurant Ordering API
  description: API для системы приема заказов и отображения статуса заказов в ресторане
  version: 1.0.0
servers:
- url: https://virtserver.swaggerhub.com/margarita-910/Restaurant_Ordering_API/1.0.0
  description: SwaggerHub API Auto Mocking (mock)
- url: https://api-dev.restaurant-ordering.local/v1
  description: Dev
- url: https://api-test.restaurant-ordering.local/v1
  description: Test
- url: https://api.restaurant-ordering.com/v1
  description: Prod
tags:
- name: Orders
  description: Выполнение ДЗ UC-8 Оформление заказа. UC-9 Просмотр статуса заказа. UC-11 Просмотр истории заказов
paths:
  /orders:
    get:
      tags:
      - Orders
      summary: Просмотреть историю заказов
      description: Возвращает список заказов клиента (история) с поддержкой пагинации.
      operationId: getOrdersHistory
      parameters:
      - name: customerId
        in: query
        description: Идентификатор клиента (для истории заказов)
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: Номер страницы (начиная с 1)
        required: false
        schema:
          minimum: 1
          type: integer
          default: 1
      - name: pageSize
        in: query
        description: Размер страницы
        required: false
        schema:
          maximum: 100
          minimum: 1
          type: integer
          default: 20
      responses:
        "200":
          description: История заказов получена (может быть пустой)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrdersHistoryResponse"
              examples:
                ok:
                  value:
                    customerId: cust-777
                    page: 1
                    pageSize: 20
                    total: 2
                    orders:
                    - orderId: ord-10001
                      status: READY
                      createdAt: 2026-01-08T12:10:00Z
                    - orderId: ord-10002
                      status: CANCELLED
                      createdAt: 2026-01-07T18:40:00Z
        "400":
          description: Некорректные параметры запроса
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                badParams:
                  value:
                    code: VALIDATION_ERROR
                    message: Некорректные параметры пагинации
        "500":
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                serverError:
                  value:
                    code: INTERNAL_ERROR
                    message: Внутренняя ошибка сервера
    post:
      tags:
      - Orders
      summary: Оформить заказ
      description: |
        Создание заказа на основе корзины клиента (Mobile/Web/Kiosk)
        Возможные исходы:
        - 201: заказ создан
        - 400: ошибка валидации запроса (формат/типы/обязательные поля)
        - 409: бизнес-ограничение (нет ингредиентов, позиция недоступна, конфликт статусов)
        - 500: внутренняя ошибка
      operationId: createOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
            examples:
              cardPayment:
                summary: Заказ с оплатой картой
                value:
                  channel: KIOSK
                  paymentMethod: CARD
                  items:
                  - menuItemId: burger-001
                    quantity: 2
                  - menuItemId: cola-001
                    quantity: 1
              cashPayment:
                summary: Заказ с оплатой наличными на кассе
                value:
                  channel: KIOSK
                  paymentMethod: CASH
                  items:
                  - menuItemId: pizza-002
                    quantity: 1
        required: true
      responses:
        "201":
          description: Заказ создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderCreatedResponse"
              examples:
                createdCard:
                  summary: "Создан, ожидает оплату картой"
                  value:
                    orderId: ord-10001
                    status: PENDING_PAYMENT
                    payment:
                      method: CARD
                      status: INITIATED
                createdCash:
                  summary: "Создан, ожидает оплату на кассе"
                  value:
                    orderId: ord-10002
                    status: AWAITING_CASHIER
                    payment:
                      method: CASH
                      status: AWAITING
        "400":
          description: Некорректные данные заказа (ошибка валидации запроса)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                validationError:
                  value:
                    code: VALIDATION_ERROR
                    message: Некорректные данные запроса
                    details:
                    - field: items
                      issue: must not be empty
        "409":
          description: Невозможно оформить заказ из-за бизнес-ограничений или конфликта состояния
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                outOfStock:
                  summary: Нет ингредиентов / недоступна позиция
                  value:
                    code: OUT_OF_STOCK
                    message: Невозможно оформить заказ — некоторые позиции недоступны
                    details:
                    - menuItemId: burger-001
                      issue: ingredients not available
                invalidState:
                  summary: Конфликт состояния заказа
                  value:
                    code: INVALID_ORDER_STATE
                    message: Невозможно выполнить операцию в текущем статусе заказа
                    details:
                    - currentStatus: PAID
                      allowedStatuses:
                      - PENDING_PAYMENT
                      - AWAITING_CASHIER
        "500":
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                serverError:
                  value:
                    code: INTERNAL_ERROR
                    message: Внутренняя ошибка сервера
  /orders/{orderId}:
    get:
      tags:
      - Orders
      summary: Просмотреть статус заказа
      description: Возвращает данные заказа и текущий статус (для табло/клиента)
      operationId: getOrderById
      parameters:
      - name: orderId
        in: path
        description: Идентификатор заказа
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Данные заказа получены
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetailsResponse"
              examples:
                ok:
                  value:
                    orderId: ord-10001
                    status: IN_PROGRESS
                    createdAt: 2026-01-09T17:35:00Z
                    channel: KIOSK
                    items:
                    - menuItemId: burger-001
                      quantity: 2
                    - menuItemId: cola-001
                      quantity: 1
        "404":
          description: Заказ не найден
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notFound:
                  value:
                    code: ORDER_NOT_FOUND
                    message: Заказ не найден
        "500":
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                serverError:
                  value:
                    code: INTERNAL_ERROR
                    message: Внутренняя ошибка сервера
components:
  schemas:
    CreateOrderRequest:
      required:
      - channel
      - items
      - paymentMethod
      type: object
      properties:
        channel:
          type: string
          description: Канал оформления заказа
          enum:
          - MOBILE
          - WEB
          - KIOSK
        paymentMethod:
          type: string
          description: Способ оплаты
          enum:
          - CARD
          - CASH
        items:
          minItems: 1
          type: array
          description: Список позиций заказа
          items:
            $ref: "#/components/schemas/OrderItem"
    OrderItem:
      required:
      - menuItemId
      - quantity
      type: object
      properties:
        menuItemId:
          type: string
          description: Идентификатор позиции меню
        quantity:
          minimum: 1
          type: integer
          description: Количество
    OrderCreatedResponse:
      required:
      - orderId
      - payment
      - status
      type: object
      properties:
        orderId:
          type: string
        status:
          type: string
          enum:
          - DRAFT
          - PENDING_PAYMENT
          - AWAITING_CASHIER
          - PAID
          - IN_PROGRESS
          - READY
          - CANCELLED
          - EXPIRED
        payment:
          $ref: "#/components/schemas/PaymentInfo"
    PaymentInfo:
      required:
      - method
      - status
      type: object
      properties:
        method:
          type: string
          enum:
          - CARD
          - CASH
        status:
          type: string
          enum:
          - INITIATED
          - AWAITING
          - PAID
          - FAILED
    ErrorResponse:
      required:
      - code
      - message
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            additionalProperties: true
    OrderDetailsResponse:
      required:
      - channel
      - createdAt
      - items
      - orderId
      - status
      type: object
      properties:
        orderId:
          type: string
        status:
          type: string
          enum:
          - DRAFT
          - PENDING_PAYMENT
          - AWAITING_CASHIER
          - PAID
          - IN_PROGRESS
          - READY
          - CANCELLED
          - EXPIRED
        createdAt:
          type: string
          format: date-time
        channel:
          type: string
          enum:
          - MOBILE
          - WEB
          - KIOSK
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
    OrderSummary:
      required:
      - createdAt
      - orderId
      - status
      type: object
      properties:
        orderId:
          type: string
        status:
          type: string
          enum:
          - DRAFT
          - PENDING_PAYMENT
          - AWAITING_CASHIER
          - PAID
          - IN_PROGRESS
          - READY
          - CANCELLED
          - EXPIRED
        createdAt:
          type: string
          format: date-time
    OrdersHistoryResponse:
      required:
      - customerId
      - orders
      - page
      - pageSize
      - total
      type: object
      properties:
        customerId:
          type: string
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        orders:
          type: array
          items:
            $ref: "#/components/schemas/OrderSummary"
