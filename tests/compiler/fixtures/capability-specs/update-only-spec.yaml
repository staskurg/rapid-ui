# Update-only resource — PATCH /{id} only, form from update
openapi: 3.0.3
info:
  title: Update Only API
  version: 1.0.0
paths:
  /items/{id}:
    patch:
      operationId: updateItem
      summary: Update item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                status:
                  type: string
                  enum: [draft, active]
              required: [name]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  status:
                    type: string
                required: [id, name]
