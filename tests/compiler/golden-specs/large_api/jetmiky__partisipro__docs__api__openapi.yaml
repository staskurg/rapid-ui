openapi: 3.0.3
info:
  title: Partisipro Platform API
  version: 1.0.0
  description: |
    Partisipro Platform API - Indonesian PPP Infrastructure Investment Platform

    This API provides access to identity-centric blockchain tokenization for Indonesian infrastructure investments.
    The platform combines Firebase Cloud Functions with ERC-3643 compliant tokens for regulatory compliance.

    ## Architecture
    - **HTTP Functions**: Traditional REST endpoints (currently just health check)
    - **Firebase Callable Functions**: All business logic functions follow Firebase callable pattern
    - **Authentication**: Firebase Auth with JWT tokens
    - **Compliance**: ERC-3643 identity verification for all financial operations

    ## Function Patterns
    - **HTTP Functions**: Standard REST patterns (GET, POST, etc.)
    - **Callable Functions**: All use POST /{functionName} with `{ data: {} }` body → `{ result: {} }` response

    ## Categories
    - **Authentication**: User management and profile operations (11 functions)
    - **Admin**: Platform administration and analytics (15 functions) 
    - **Projects**: Project creation and management (6 functions)
    - **KYC**: Identity verification processes (5 functions)
    - **Investments**: Investment creation and management (4 functions)
    - **Payments**: Payment processing and vouchers (3 functions)
    - **Governance**: Proposal creation and voting (5 functions)
    - **Claims**: ERC-3643 identity claims management (5 functions)
    - **Distributions**: Profit distribution and claims (5 functions)

  contact:
    name: Partisipro Backend Team
    url: https://github.com/partisipro/platform
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://us-central1-{project-id}.cloudfunctions.net
    description: Firebase Cloud Functions Production
    variables:
      project-id:
        default: partisipro-production
        description: Firebase project ID
  - url: http://127.0.0.1:5001/{project-id}/us-central1
    description: Firebase Emulator (Development)
    variables:
      project-id:
        default: partisipro-dev
        description: Local Firebase project ID

security:
  - FirebaseAuth: []

paths:
  # ============================================================================
  # HTTP FUNCTIONS
  # ============================================================================

  /health:
    get:
      summary: Health Check Endpoint
      description: |
        Returns the health status of the platform services including database and storage connectivity.
        This endpoint does not require authentication and can be used for monitoring and load balancer health checks.
      tags:
        - System
      security: [] # No authentication required
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [healthy, degraded]
                    example: healthy
                  timestamp:
                    type: string
                    format: date-time
                    example: '2024-01-15T10:30:00Z'
                  services:
                    type: object
                    properties:
                      database:
                        type: string
                        enum: [healthy, unhealthy]
                        example: healthy
                      storage:
                        type: string
                        enum: [healthy, unhealthy]
                        example: healthy
                required:
                  - status
                  - timestamp
                  - services
              examples:
                healthy:
                  summary: All services healthy
                  value:
                    status: healthy
                    timestamp: '2024-01-15T10:30:00Z'
                    services:
                      database: healthy
                      storage: healthy
                degraded:
                  summary: Some services unhealthy
                  value:
                    status: degraded
                    timestamp: '2024-01-15T10:30:00Z'
                    services:
                      database: healthy
                      storage: unhealthy
        '500':
          description: Service error
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [error]
                  timestamp:
                    type: string
                    format: date-time
                  error:
                    type: string
                    description: Error message
                required:
                  - status
                  - timestamp
                  - error
        '503':
          description: Service degraded
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [degraded]
                  timestamp:
                    type: string
                    format: date-time
                  services:
                    type: object
                    properties:
                      database:
                        type: string
                        enum: [healthy, unhealthy]
                      storage:
                        type: string
                        enum: [healthy, unhealthy]
                required:
                  - status
                  - timestamp
                  - services

  # ============================================================================
  # TEST/UTILITY CALLABLE FUNCTIONS
  # ============================================================================

  /hello:
