# ============================================================================
# COMPONENTS SECTION
# ============================================================================

components:
  securitySchemes:
    FirebaseAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Firebase Authentication JWT token. Include the ID token in the Authorization header as:
        `Authorization: Bearer <firebase-id-token>`

        The token must be obtained through Firebase Authentication and will be validated
        by Firebase Cloud Functions automatically for callable functions.

  # ============================================================================
  # SHARED SCHEMAS
  # ============================================================================

  schemas:
    # Firebase Callable Request Pattern
    FirebaseCallableRequest:
      type: object
      description: Standard Firebase callable function request wrapper
      properties:
        data:
          type: object
          description: Request data payload (empty object for functions with no parameters)
          example: {}
      required:
        - data

    # Standard API Response Types
    ErrorResponse:
      type: object
      description: Standard error response format
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Error code identifier
            message:
              type: string
              description: Human-readable error message
            details:
              type: object
              description: Additional error details
              additionalProperties: true
            category:
              type: string
              enum:
                [validation, authentication, authorization, business, system]
              description: Error categorization for handling
            retryable:
              type: boolean
              description: Whether the error can be retried
          required:
            - code
            - message
      required:
        - error

    # Common Response Patterns
    SuccessResponse:
      type: object
      description: Standard success response format
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          description: Success message
      required:
        - success

    PaginationRequest:
      type: object
      description: Pagination parameters for list endpoints
      properties:
        page:
          type: integer
          minimum: 1
          default: 1
          description: Page number (1-based)
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
          description: Number of items per page
        orderBy:
          type: string
          description: Field to order by
        orderDirection:
          type: string
          enum: [asc, desc]
          default: desc
          description: Order direction

    PaginationResponse:
      type: object
      description: Pagination metadata in responses
      properties:
        page:
          type: integer
          description: Current page number
        limit:
          type: integer
          description: Items per page
        total:
          type: integer
          description: Total number of items
        totalPages:
          type: integer
          description: Total number of pages
        hasNext:
          type: boolean
          description: Whether there are more pages
        hasPrev:
          type: boolean
          description: Whether there are previous pages
      required:
        - page
        - limit
        - total
        - totalPages
        - hasNext
        - hasPrev

    # ========================================================================
    # REQUEST/RESPONSE TYPES - PLACEHOLDER REFERENCES
    # These reference the actual types from shared-types package
    # ========================================================================

    # Authentication Types
    GetCurrentUserResponse:
      type: object
