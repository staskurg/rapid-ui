      description: Invalid request parameters or format
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: 'INVALID_ARGUMENT'
              message: 'Invalid request parameters'
              category: 'validation'
              retryable: false

